# Sample nginx configuration for homebox-landing
#
# This assumes:
#   - Homebox is running on 127.0.0.1:7745
#   - homebox-landing is running on 127.0.0.1:8080
#   - TLS is already configured (certificates not shown)
#
# The geo block identifies whether a request comes from an internal network.
# External visitors are redirected to the landing page; internal visitors
# are proxied straight through to Homebox.
#
# Place the geo block and limit_req_zone in the http {} context (e.g. nginx.conf
# or a file in conf.d/). Place the server block in sites-available/.

# ── http {} context ────────────────────────────────────────────────────────────

geo $is_internal {
    default           0;
    127.0.0.0/8       1;
    10.0.0.0/8        1;
    172.16.0.0/12     1;
    192.168.0.0/16    1;
    ::1/128           1;
    # Uncomment if using Tailscale:
    # 100.64.0.0/10   1;
}

limit_req_zone $binary_remote_addr zone=landing:10m rate=10r/m;

# ── server block ───────────────────────────────────────────────────────────────

server {
    listen 443 ssl http2;
    server_name homebox.yourdomain.com;

    ssl_certificate     /etc/ssl/certs/homebox.yourdomain.com.crt;
    ssl_certificate_key /etc/ssl/private/homebox.yourdomain.com.key;

    # Redirect external QR code scans to the landing page
    location ~ ^/a/ {
        if ($is_internal = 0) {
            return 302 https://$host/landing?ref=$request_uri;
        }
        # Internal: proxy straight to Homebox
        proxy_pass http://127.0.0.1:7745;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Landing page and photo proxy → homebox-landing
    location /landing {
        limit_req zone=landing burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host      $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Everything else → Homebox
    location / {
        proxy_pass http://127.0.0.1:7745;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name homebox.yourdomain.com;
    return 301 https://$host$request_uri;
}
