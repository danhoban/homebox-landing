<div class="card">
  <div class="section">
    <div class="icon-box">&#128269;</div>
    <h1>Nothing here</h1>
    <div class="subtitle">This QR code doesn't match anything in our inventory. It may have been removed or the code is outdated.</div>
  </div>
  <div class="divider"></div>
  <div class="section">
    <button class="reveal-btn" id="reveal-btn" onclick="
      document.getElementById('contact-section').style.display='block';
      this.style.display='none';
    ">Show contact details</button>
    <div id="contact-section" style="display:none">
      <div class="section-label">Still need help?</div>
      <div class="contact-list">
        ${contact_links}
      </div>
    </div>
  </div>
</div>
