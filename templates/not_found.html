<div class="card">
  <div class="not-found-hero">
    <svg width="140" height="140" viewBox="0 0 140 140" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Cut string -->
      <path d="M70 18 Q70 30 70 38" stroke="#a8bcc8" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 3"/>
      <!-- Snip mark -->
      <g transform="translate(70,18) rotate(45)">
        <line x1="-6" y1="0" x2="6" y2="0" stroke="#a8bcc8" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="0" y1="-6" x2="0" y2="6" stroke="#a8bcc8" stroke-width="1.5" stroke-linecap="round"/>
      </g>
      <!-- Tag body -->
      <g transform="translate(70,80) rotate(-6)">
        <rect x="-34" y="-36" width="68" height="52" rx="5" fill="#dce8f0" fill-opacity="0.7" stroke="#98b4c8" stroke-width="1.5"/>
        <!-- Hole -->
        <circle cx="0" cy="-28" r="4" fill="none" stroke="#98b4c8" stroke-width="1.5"/>
        <!-- 404 -->
        <text x="0" y="-4" text-anchor="middle" font-size="22" font-weight="300" fill="#7898b0" font-family="-apple-system,sans-serif" letter-spacing="2">404</text>
        <!-- Divider -->
        <line x1="-24" y1="4" x2="24" y2="4" stroke="#98b4c8" stroke-width="0.75" opacity="0.5"/>
        <!-- NOT FOUND -->
        <text x="0" y="14" text-anchor="middle" font-size="7" font-weight="500" fill="#98b4c8" font-family="-apple-system,sans-serif" letter-spacing="1.5">NOT FOUND</text>
      </g>
      <!-- Shadow -->
      <ellipse cx="70" cy="112" rx="28" ry="5" fill="#a8bcc8" fill-opacity="0.15"/>
      <!-- Floating dots -->
      <circle cx="24" cy="55" r="2" fill="#a8bcc8" fill-opacity="0.25"/>
      <circle cx="112" cy="44" r="2.5" fill="#a8bcc8" fill-opacity="0.2"/>
      <circle cx="118" cy="70" r="1.5" fill="#a8bcc8" fill-opacity="0.2"/>
      <circle cx="20" cy="80" r="1.5" fill="#a8bcc8" fill-opacity="0.15"/>
    </svg>
  </div>
  <div class="section">
    <h1>Nothing here</h1>
    <div class="subtitle">This link doesn't match any item in the catalogue. It may have been removed or reassigned.</div>
  </div>
  <div class="divider"></div>
  <div class="section">
    <button class="reveal-btn" id="reveal-btn" onclick="
      document.getElementById('contact-section').style.display='block';
      this.style.display='none';
    ">Show contact details</button>
    <div id="contact-section" style="display:none">
      <div class="section-label">Need help?</div>
      <div class="contact-list">
        ${contact_links}
      </div>
    </div>
  </div>
</div>
