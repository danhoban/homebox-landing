<div class="card">
  <div class="item-hero">
    <svg width="130" height="120" viewBox="0 0 130 120" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="42" y="52" width="46" height="32" rx="5" fill="#d8d0e4" fill-opacity="0.6" stroke="#b0a0c8" stroke-width="1.5"/>
      <rect x="50" y="44" width="30" height="14" rx="4" fill="#e4dced" fill-opacity="0.7" stroke="#b0a0c8" stroke-width="1.5"/>
      <path d="M65 28 C65 28 65 20 65 18" stroke="#b0a0c8" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M58 24 L65 18 L72 24" stroke="#b0a0c8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M30 74 C30 74 22 70 20 62 C18 54 24 48 32 50" stroke="#c0b0d8" stroke-width="1.5" stroke-linecap="round" fill="none" stroke-dasharray="3 3"/>
      <path d="M100 74 C100 74 108 70 110 62 C112 54 106 48 98 50" stroke="#c0b0d8" stroke-width="1.5" stroke-linecap="round" fill="none" stroke-dasharray="3 3"/>
      <line x1="54" y1="62" x2="76" y2="62" stroke="#b0a0c8" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
      <line x1="54" y1="68" x2="76" y2="68" stroke="#b0a0c8" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
      <line x1="54" y1="74" x2="68" y2="74" stroke="#b0a0c8" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
    </svg>
  </div>
  <div class="section">
    <h1>Hey — looks like you've found something that might be lost</h1>
    <div class="subtitle">The owner would love to have it back. If you're able to help, tap the button below to get in touch.</div>
  </div>
  <div class="divider"></div>
  <div class="section">
    <div class="section-label">Item</div>
    <div class="kv-row">
      <span class="kv-key">Name</span>
      <span class="kv-val">${item_name}</span>
    </div>
    <div class="kv-row">
      <span class="kv-key">Description</span>
      <span class="kv-val">${description}</span>
    </div>
    <div class="kv-row">
      <span class="kv-key">Asset ref</span>
      <span class="kv-val kv-ref">#${asset_id}</span>
    </div>
  </div>
  <div class="divider"></div>
  <div class="section">
    <button class="reveal-btn" id="reveal-btn" onclick="
      document.getElementById('contact-section').style.display='block';
      this.style.display='none';
    ">I'd like to return this</button>
    <div id="contact-section" style="display:none">
      <div class="section-label">Return this item</div>
      <div class="contact-list">
        ${contact_links}
      </div>
    </div>
  </div>
</div>
