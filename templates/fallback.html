<div class="card">
  <div class="section">
    <div class="icon-box">&#9888;&#65039;</div>
    <div class="warn-banner">Details temporarily unavailable</div>
    <h1>Get in touch</h1>
    <div class="subtitle">We couldn't load item details right now. Please use the contact details below to reach the owner.</div>
  </div>
  <div class="divider"></div>
  <div class="section">
    <button class="reveal-btn" id="reveal-btn" onclick="
      document.getElementById('contact-section').style.display='block';
      this.style.display='none';
    ">Show contact details</button>
    <div id="contact-section" style="display:none">
      <div class="section-label">Contact</div>
      <div class="contact-list">
        ${contact_links}
      </div>
    </div>
  </div>
</div>
